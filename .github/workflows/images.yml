name: Photography

# Fetching 112 photographs from Unsplash is slow and rate-limited, so it is not
# part of CI. This is here so a re-roll is one click rather than something only
# one person's laptop can do — and so the lockfile it produces is committed by
# a machine rather than pasted from a terminal.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-roll every photograph, not just the missing ones
        type: boolean
        default: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run images${{ inputs.force && ':force' || '' }}
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: photography
          title: Refresh the catalogue photography
          commit-message: Refresh the catalogue photography
          body: |
            Ran `npm run images${{ inputs.force && ':force' || '' }}`.

            Look at the contact sheet before merging — a search result that
            drifted is the usual reason a garment is standing in for the wrong
            thing.
